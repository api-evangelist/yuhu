notes: >-
  Yuhu Partners API uses OAuth 2.0 client-credentials. Partners exchange a client_id and
  client_secret for a bearer access token, then send it as an Authorization: Bearer header
  on all v1 requests. Tokens can be revoked. No user-delegated flows or API keys are
  documented; there is no documented OAuth scope surface (client-credentials only).
schemes:
- name: OAuth2ClientCredentials
  type: oauth2
  flow: clientCredentials
  token_url: https://api.yuhu.io/partners/token
  revocation_url: https://api.yuhu.io/partners/revoke
  grant_type: client_credentials
  token_type: Bearer
  sources: [https://developer.yuhu.io/]
token_endpoint:
