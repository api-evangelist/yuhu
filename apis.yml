aid: yuhu
name: Yuhu
description: >-
  Yuhu is a cloud-based rental lifecycle management platform for multifamily and
  single-family property managers, covering leasing, prospects and applications,
  tenants and leases, buildings and units, service requests, notices, amenities,
  showings, rentable items, and rent payments (EFT/ACH pre-authorized debit).
  Founded in Toronto in 2015 and acquired by HappyCo in November 2022, Yuhu is now
  part of HappyCo's Happy Property suite. Yuhu exposes a REST Partners API (v1) at
  api.yuhu.io that lets integration partners and PMS systems synchronize companies,
  sites, buildings, unit types, units, leases, tenants, service requests, notices,
  and payments using OAuth 2.0 client-credentials bearer tokens, upsert-style writes,
  synchronous and asynchronous batch endpoints, and per-resource hourly rate limits.
