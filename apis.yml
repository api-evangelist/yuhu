apis:
- name: Yuhu Partners API
  description: >-
    REST API (v1) for integration partners to synchronize property-management data with
    Yuhu: companies, sites/projects, buildings, unit types, units, site staff, roles and
    permissions, leases, tenants, service requests, notices, notification preferences,
    amenities, payments (EFT/ACH pre-authorized debit), traffic sources, prospects,
    applications, showings, rentable items, and rental incentives. Authenticated with
    OAuth 2.0 client-credentials bearer tokens; writes are upserts; supports synchronous
    and asynchronous batch endpoints with per-resource hourly rate limits.
  humanURL: https://developer.yuhu.io/
